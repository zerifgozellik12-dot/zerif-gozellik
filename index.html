<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zarif Beauty</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f7f2f4;
  font-family:Arial,sans-serif;
  color:#222;
}

.page{
  max-width:600px;
  margin:auto;
  padding:25px 18px;
}

.logo{
  text-align:center;
  font-size:30px;
  font-weight:bold;
  margin:15px 0 30px;
}

.card{
  background:white;
  border-radius:18px;
  padding:28px 22px;
  box-shadow:0 4px 18px rgba(0,0,0,.08);
  text-align:center;
}

h2{
  margin:0 0 12px;
  font-size:24px;
}

p{
  line-height:1.5;
  color:#555;
}

.info{
  background:#f8eef2;
  border-radius:12px;
  padding:14px;
  margin:20px 0;
  font-size:14px;
}

button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:16px;
  font-size:17px;
  font-weight:bold;
  background:#d85b8a;
  color:white;
  cursor:pointer;
}

button:disabled{
  background:#aaa;
}

#status{
  margin-top:20px;
  font-weight:bold;
}

#result{
  margin-top:18px;
  display:none;
  background:#f1f8f3;
  border-radius:12px;
  padding:15px;
  text-align:left;
  font-size:14px;
  word-break:break-word;
}

#result a{
  display:block;
  margin-top:12px;
  color:#1677c8;
  font-weight:bold;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="page">

  <div class="logo">
    Zarif Beauty
  </div>

  <div class="card">

    <h2>Location Sharing</h2>

    <p>
      Please tap the button below to share your location.
    </p>

    <div class="info">
      📍 Your location will only be accessed after you give permission.
      No camera or photo is used.
    </div>

    <button id="locationBtn">
      📍 Share My Location
    </button>

    <div id="status"></div>

    <div id="result">
      <div><b>Location received successfully.</b></div>

      <div id="coordinates"></div>

      <a id="mapsLink" href="#" target="_blank">
        📍 Open in Google Maps
      </a>
    </div>

  </div>

</div>

<script>

const BACKEND_URL =
"https://script.google.com/macros/s/AKfycbzeqyh-gaDySv5fZN6ZWRHOPQDnmW71oeFi5xUtPbydUBixx_geJoNJyKlXeuZuQX43ag/exec";

const button = document.getElementById("locationBtn");
const status = document.getElementById("status");
const result = document.getElementById("result");
const coordinates = document.getElementById("coordinates");
const mapsLink = document.getElementById("mapsLink");

button.addEventListener("click", function(){

  if(!navigator.geolocation){
    status.textContent =
      "Location services are not supported on this device.";
    return;
  }

  button.disabled = true;
  button.textContent = "Getting Location...";
  status.textContent =
    "Please allow location access when prompted.";

  navigator.geolocation.getCurrentPosition(

    function(position){

      const latitude = position.coords.latitude;
      const longitude = position.coords.longitude;
      const accuracy = position.coords.accuracy;

      const mapsUrl =
        "https://www.google.com/maps?q=" +
        latitude + "," + longitude;

      coordinates.innerHTML =
        "Latitude: " + latitude +
        "<br>Longitude: " + longitude +
        "<br>Accuracy: approximately " +
        Math.round(accuracy) + " meters";

      mapsLink.href = mapsUrl;

      result.style.display = "block";

      status.textContent =
        "Location received successfully.";

      button.textContent =
        "✓ Location Shared";

      fetch(BACKEND_URL,{
        method:"POST",
        mode:"no-cors",
        headers:{
          "Content-Type":"text/plain;charset=utf-8"
        },
        body:JSON.stringify({
          latitude:latitude,
          longitude:longitude,
          accuracy:accuracy,
          mapsUrl:mapsUrl
        })
      }).catch(function(){});

    },

    function(error){

      button.disabled = false;
      button.textContent = "📍 Share My Location";

      if(error.code === 1){
        status.textContent =
          "Location permission was denied.";
      }
      else if(error.code === 2){
        status.textContent =
          "Unable to determine your location.";
      }
      else if(error.code === 3){
        status.textContent =
          "Location request timed out. Please try again.";
      }
      else{
        status.textContent =
          "An error occurred while getting your location.";
      }

    },

    {
      enableHighAccuracy:true,
      timeout:15000,
      maximumAge:0
    }

  );

});

</script>

</body>
</html>
